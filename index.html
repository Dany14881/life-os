<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0920"><meta name="apple-mobile-web-app-capable" content="yes"><title>Life OS</title><style>
:root{--bg:#090816;--p:#17132f;--l:#f3b4d833;--pink:#f4a6d4;--purple:#b78cf5;--w:#f8f3ff;--m:#aaa1c0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:radial-gradient(circle at 20% 20%,#6d3d6d99,transparent 25%),radial-gradient(circle at 80% 35%,#4e3b8c88,transparent 28%),linear-gradient(145deg,#17102a,#090816 60%,#130c26);min-height:100vh}.app{max-width:720px;margin:auto;padding:10px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center}.nav{width:42px;height:42px;border:1px solid var(--l);border-radius:50%;background:#09081677;color:white;font-size:25px}.date{text-align:center;color:#d8cde2;font-size:15px}.date b{display:block;color:#fff;font-size:18px}.score{text-align:center;margin:7px}.score label{font-size:12px;letter-spacing:2px}.score strong{display:block;font-size:58px;background:linear-gradient(90deg,#fff,#f1a5d4,#bd9bf8);-webkit-background-clip:text;color:transparent}.score span{color:#e7bfdc}.radar{position:relative;width:min(94vw,650px);height:min(94vw,650px);margin:auto}.radar svg{position:absolute;width:100%;height:100%}.metric{position:absolute;transform:translate(-50%,-50%);width:96px;text-align:center}.metric .name{font-size:12px}.metric .icon{display:block;font-size:17px}.rate{display:flex;justify-content:center;align-items:center;gap:4px}.rate button{width:27px;height:27px;border-radius:50%;border:1px solid var(--l);background:#09081699;color:white;font-size:17px}.num{font-size:21px;min-width:26px}.metric small{font-size:9px;color:var(--m)}.m1{left:50%;top:7%}.m2{left:81%;top:25%}.m3{left:90%;top:50%}.m4{left:76%;top:77%}.m5{left:50%;top:94%}.m6{left:24%;top:77%}.m7{left:10%;top:50%}.m8{left:19%;top:25%}.card{background:#14122bcc;border:1px solid var(--l);border-radius:21px;padding:15px;margin-top:12px;backdrop-filter:blur(12px)}h3{margin:0 0 11px;font-size:14px;letter-spacing:1px}.days{display:flex;gap:7px;overflow:auto}.day{min-width:62px;padding:8px 3px;border:1px solid var(--l);background:#09081677;color:#ddd;border-radius:13px;text-align:center}.day b{display:block;font-size:11px}.day span{font-size:15px;color:#efb6da}.sel{border-color:#e8a7d2!important}.summary{font-size:14px;line-height:1.5;color:#ddd}.summary strong{color:#f3b8dc}.calhead{display:flex;justify-content:space-between}.muted{color:var(--m)}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{text-align:center;padding:7px 1px;font-size:11px}.cal .has{border:1px solid #f4a6d455;border-radius:8px}.note{width:100%;min-height:75px;background:#09081699;border:1px solid var(--l);border-radius:13px;color:#fff;padding:10px;font:inherit}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:flex;justify-content:space-around;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#080714dd;backdrop-filter:blur(16px);border-top:1px solid var(--l);z-index:5}.bottom button{background:none;border:0;color:#c9bfd4;font-size:11px}.bottom .plus{margin-top:-24px;width:54px;height:54px;border-radius:50%;border:1px solid var(--pink);color:#fff;font-size:29px;background:#17132f;box-shadow:0 0 25px #f4a6d444}.sheet{position:fixed;inset:0;background:#05040eb8;display:none;align-items:flex-end;z-index:10}.sheet.show{display:flex}.modal{width:100%;max-width:720px;margin:auto;background:#15122b;border:1px solid var(--l);border-radius:25px 25px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}.modal h2{text-align:center;margin:0 0 5px}.pickname{text-align:center;color:#e9bfdc}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.keys button{height:50px;border:1px solid var(--l);border-radius:13px;background:#211c3d;color:#fff;font-size:19px}.keys .on{background:linear-gradient(135deg,#8f5bc6,#e78fc3)}.close{width:100%;margin-top:12px;padding:13px;border:1px solid var(--l);border-radius:13px;background:none;color:#bbb;font-size:16px}@media(max-width:390px){.metric{width:82px}.metric .name{font-size:10px}}
</style></head><body><div class="app"><div class="top"><button class="nav" onclick="move(-1)">‹</button><div class="date" id="date"></div><button class="nav" onclick="move(1)">›</button></div><div class="score"><label>LIFE SCORE</label><strong id="score">0%</strong><span id="scoreText">Rate your day</span></div><div class="radar"><svg viewBox="0 0 500 500"><polygon points="250,35 402,110 440,280 355,425 145,425 60,280 98,110" fill="none" stroke="#f4bedc44"/><polygon points="250,90 355,142 382,265 320,365 180,365 118,265 145,142" fill="none" stroke="#f4bedc2b"/><polygon points="250,145 308,173 325,250 285,305 215,305 175,250 192,173" fill="none" stroke="#f4bedc22"/><g stroke="#f4bedc2b"><line x1="250" y1="35" x2="250" y2="250"/><line x1="402" y1="110" x2="250" y2="250"/><line x1="440" y1="280" x2="250" y2="250"/><line x1="355" y1="425" x2="250" y2="250"/><line x1="145" y1="425" x2="250" y2="250"/><line x1="60" y1="280" x2="250" y2="250"/><line x1="98" y1="110" x2="250" y2="250"/></g><polygon id="shape" fill="#f4a6d422" stroke="#f5b6da" stroke-width="1.5"/><g id="dots"></g><circle cx="250" cy="250" r="24" fill="#b78cf544" stroke="#f2b5da"/><circle cx="250" cy="250" r="7" fill="#f4c1df"/></svg>
<script>const names=['Sleep','Energy','Mood','Focus','Productivity','Goals','Health','Social'],icons=['☾','ϟ','☺','◎','▮','⚑','♡','♧'];for(let i=0;i<8;i++)document.write(`<div class="metric m${i+1}"><span class="icon">${icons[i]}</span><span class="name">${names[i]}</span><div class="rate"><button onclick="step(${i},-1)">−</button><span class="num" id="n${i}">0</span><button onclick="step(${i},1)">+</button></div><small>/10</small></div>`);</script></div><section class="card"><h3>RECENT DAYS</h3><div class="days" id="days"></div></section><section class="card"><h3>DAY SUMMARY</h3><div class="summary" id="summary">Rate your metrics and your daily summary will appear here.</div></section><section class="card"><div class="calhead"><h3>CALENDAR</h3><span class="muted" id="month"></span></div><div class="cal" id="cal"></div></section><section class="card"><h3>JOURNAL</h3><textarea class="note" id="note" placeholder="One sentence about today..."></textarea></section></div><nav class="bottom"><button onclick="scrollTo(0,0)">✦<br>Today</button><button onclick="document.getElementById('cal').scrollIntoView({behavior:'smooth'})">▦<br>Calendar</button><button class="plus" onclick="picker(0)">+</button><button onclick="document.getElementById('summary').scrollIntoView({behavior:'smooth'})">▥<br>Stats</button><button onclick="document.getElementById('note').focus()">▤<br>Journal</button></nav><div class="sheet" id="sheet" onclick="if(event.target===this)closePick()"><div class="modal"><h2>FAST RATING</h2><div class="pickname" id="pickname"></div><div class="keys" id="keys"></div><button class="close" onclick="closePick()">Done</button></div></div>
<script>
const KEY='lifeos_days_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{}'),view=new Date();view.setHours(12,0,0,0);let pi=0;
function k(d){return d.toISOString().slice(0,10)}function gd(d){return data[k(d)]||{s:Array(8).fill(0),n:''}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function sc(s){let a=s.filter(x=>x>0);return a.length?Math.round(a.reduce((a,b)=>a+b,0)/a.length*10):0}function txt(x){return x>=80?'Excellent day':x>=70?'Good day':x>=50?'Mixed day':'Rough day'}
function render(){let d=gd(view),x=sc(d.s);document.getElementById('date').innerHTML=`<span>${view.toLocaleDateString('en-US',{weekday:'long'})}</span><b>${view.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</b>`;document.getElementById('score').textContent=x+'%';document.getElementById('scoreText').textContent=x?txt(x):'Rate your day';d.s.forEach((v,i)=>document.getElementById('n'+i).textContent=v);let p=[[250,35],[402,110],[440,280],[355,425],[145,425],[60,280],[98,110]].map((q,i)=>{let v=d.s[i]||0;return [250+(q[0]-250)*v/10,250+(q[1]-250)*v/10]}),ps=p.map(q=>q.map(z=>z.toFixed(1)).join(',')).join(' ');document.getElementById('shape').setAttribute('points',ps);document.getElementById('dots').innerHTML=p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#f7bddf"/>`).join('');document.getElementById('note').value=d.n||'';days();calendar();summary(d,x)}
function step(i,z){let d=gd(view);d.s[i]=Math.max(0,Math.min(10,d.s[i]+z));data[k(view)]=d;save();render()}function picker(i){pi=i;document.getElementById('pickname').textContent=names[i];document.getElementById('keys').innerHTML='';for(let n=0;n<=10;n++){let b=document.createElement('button');b.textContent=n;b.className=gd(view).s[i]===n?'on':'';b.onclick=()=>{let d=gd(view);d.s[i]=n;data[k(view)]=d;save();render();picker(i)};document.getElementById('keys').appendChild(b)}document.getElementById('sheet').classList.add('show')}function closePick(){document.getElementById('sheet').classList.remove('show')}function move(n){view.setDate(view.getDate()+n);render()}
function days(){let e=document.getElementById('days');e.innerHTML='';for(let j=-3;j<=3;j++){let d=new Date(view);d.setDate(d.getDate()+j);let x=sc(gd(d).s),b=document.createElement('button');b.className='day '+(j===0?'sel':'');b.innerHTML=`<b>${d.toLocaleDateString('en-US',{day:'numeric',weekday:'short'})}</b><span>${x||'—'}${x?'%':''}</span>`;b.onclick=()=>{view=d;render()};e.appendChild(b)}}
function calendar(){let e=document.getElementById('cal'),y=view.getFullYear(),m=view.getMonth();document.getElementById('month').textContent=view.toLocaleDateString('en-US',{month:'long',year:'numeric'});e.innerHTML=['M','T','W','T','F','S','S'].map(x=>`<div>${x}</div>`).join('');let st=(new Date(y,m,1).getDay()+6)%7;for(let i=0;i<st;i++)e.innerHTML+='<div></div>';for(let n=1;n<=new Date(y,m+1,0).getDate();n++){let d=new Date(y,m,n),x=sc(gd(d).s);e.innerHTML+=`<div class="${x?'has ':''}${k(d)===k(view)?'sel':''}" onclick="pickDate(${n})">${n}<br><span style="font-size:9px;color:${x>=70?'#a7e8a0':x?'#efb0b9':'#777'}">${x?x+'%':'·'}</span></div>`}}function pickDate(n){view=new Date(view.getFullYear(),view.getMonth(),n);view.setHours(12);render()}
function summary(d,x){let r=names.map((n,i)=>({n,v:d.s[i]})).filter(a=>a.v).sort((a,b)=>b.v-a.v);if(!x){document.getElementById('summary').textContent='Rate your metrics and your daily summary will appear here.';return}let t=`Overall <strong>${x}%</strong> — ${txt(x)}. `;if(r[0])t+=`Strongest: <strong>${r[0].n} ${r[0].v}/10</strong>. `;let low=r.filter(a=>a.v<7).sort((a,b)=>a.v-b.v)[0];if(low)t+=`Watch: <strong>${low.n} ${low.v}/10</strong>.`;if(d.n)t+=`<br><br>${d.n.replace(/[<>]/g,'')}`;document.getElementById('summary').innerHTML=t}
document.getElementById('note').addEventListener('input',e=>{let d=gd(view);d.n=e.target.value;data[k(view)]=d;save();summary(d,sc(d.s))});render();
</script></body></html>
