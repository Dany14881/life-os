<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               minimum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#8b5cf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>LifeOS</title>

<style>
:root{
  --purple:#7650b8;
  --purple2:#a56bd4;
  --pink:#f0a9d1;
  --deep:#241633;
  --ink:#24172f;
  --white:#fffaff;
  --line:rgba(45,20,65,.35);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  touch-action:pan-y;
  overscroll-behavior-x:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
               "Segoe UI",sans-serif;
  color:var(--ink);
}

body{
  background:
    radial-gradient(circle at 15% 20%,
      rgba(255,205,232,.95) 0%,
      rgba(255,205,232,0) 32%),
    radial-gradient(circle at 85% 25%,
      rgba(196,154,242,.95) 0%,
      rgba(196,154,242,0) 35%),
    radial-gradient(circle at 50% 100%,
      rgba(170,113,221,.85) 0%,
      rgba(170,113,221,0) 45%),
    linear-gradient(145deg,#ffd9eb,#d8b4ef 52%,#9c71d0);
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:720px;
  min-height:100vh;
  margin:auto;
  padding:
    max(28px,env(safe-area-inset-top))
    18px
    max(30px,env(safe-area-inset-bottom));
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.brand{
  font-size:36px;
  font-weight:800;
  letter-spacing:-1.5px;
}

.subtitle{
  margin-top:2px;
  font-size:15px;
  opacity:.68;
}

.home{
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.7);
  border:1px solid var(--line);
  font-size:23px;
}

/* DATE */

.datebar{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  margin:18px 0 2px;
}

.datebar button{
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(255,255,255,.55);
  color:var(--deep);
  font-size:26px;
}

.date{
  min-width:190px;
  text-align:center;
  font-size:18px;
  font-weight:700;
}

/* MAIN GEOMETRY */

.orbit{
  position:relative;
  width:min(100%,610px);
  aspect-ratio:1/1;
  margin:5px auto 0;
}

.core{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:43%;
  aspect-ratio:1;
  background:rgba(255,255,255,.10);
  border:1.5px solid var(--line);
  clip-path:polygon(
    50% 0%,
    70% 6%,
    87% 20%,
    97% 40%,
    97% 60%,
    87% 80%,
    70% 94%,
    50% 100%,
    30% 94%,
    13% 80%,
    3% 60%,
    3% 40%,
    13% 20%,
    30% 6%
  );
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.score{
  font-size:42px;
  font-weight:800;
  line-height:1;
}

.scoreLabel{
  margin-top:8px;
  font-size:14px;
  letter-spacing:1px;
  opacity:.7;
}

/* METRICS */

.metric{
  position:absolute;
  width:94px;
  text-align:center;
  transform:translate(-50%,-50%);
}

.metric:nth-child(2){left:50%;top:9%}
.metric:nth-child(3){left:82%;top:24%}
.metric:nth-child(4){left:91%;top:50%}
.metric:nth-child(5){left:78%;top:77%}
.metric:nth-child(6){left:50%;top:91%}
.metric:nth-child(7){left:22%;top:77%}
.metric:nth-child(8){left:9%;top:50%}
.metric:nth-child(9){left:18%;top:24%}

.metricCircle{
  width:78px;
  height:78px;
  margin:auto;
  border-radius:50%;
  background:rgba(255,250,255,.72);
  border:1.5px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:800;
  color:#65439d;
  box-shadow:0 8px 25px rgba(60,20,80,.08);
}

.metricName{
  margin-top:7px;
  font-size:13px;
  font-weight:700;
}

/* NUMBER PICKER */

.picker{
  display:none;
  position:fixed;
  z-index:100;
  left:12px;
  right:12px;
  bottom:
    max(18px,env(safe-area-inset-bottom));
  background:rgba(48,26,67,.97);
  border:1px solid rgba(255,255,255,.2);
  border-radius:24px;
  padding:15px;
  box-shadow:0 15px 50px rgba(30,10,45,.35);
  backdrop-filter:blur(20px);
}

.picker.show{
  display:block;
}

.pickerTitle{
  color:white;
  text-align:center;
  font-size:14px;
  margin-bottom:10px;
  opacity:.8;
}

.numbers{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:5px;
}

.number{
  aspect-ratio:1;
  border-radius:13px;
  background:rgba(255,255,255,.12);
  color:white;
  font-weight:800;
  font-size:16px;
}

.number:active,
.number.selected{
  background:#c98be8;
  color:#241633;
}

/* DAY CARD */

.card{
  margin-top:15px;
  padding:22px;
  border-radius:28px;
  background:rgba(255,250,255,.82);
  border:1px solid rgba(70,30,90,.18);
  box-shadow:0 12px 40px rgba(70,25,90,.12);
}

.card h2{
  margin:0 0 8px;
  font-size:25px;
}

.hint{
  color:#66566d;
  font-size:14px;
  margin-bottom:13px;
}

textarea{
  width:100%;
  min-height:90px;
  resize:none;
  border:1px solid #cfb4dd;
  border-radius:18px;
  padding:15px;
  outline:none;
  background:rgba(255,255,255,.7);
  color:var(--ink);
}

textarea:focus{
  border-color:#8758b8;
}

.save{
  width:100%;
  margin-top:14px;
  padding:15px;
  border-radius:17px;
  background:#63399b;
  color:white;
  font-weight:800;
  font-size:17px;
}

.save:active{
  transform:scale(.98);
}

/* HISTORY */

.history{
  margin-top:15px;
}

.historyTitle{
  font-size:23px;
  font-weight:800;
  margin-bottom:12px;
}

.historyItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  margin-bottom:8px;
  border-radius:17px;
  background:rgba(255,255,255,.65);
}

.historyDate{
  font-weight:700;
}

.historyScore{
  font-weight:800;
  color:#7047a8;
}

/* MOBILE */

@media(max-width:430px){
  .app{
    padding-left:12px;
    padding-right:12px;
  }

  .brand{
    font-size:32px;
  }

  .orbit{
    width:100%;
  }

  .metric{
    width:75px;
  }

  .metricCircle{
    width:65px;
    height:65px;
    font-size:21px;
  }

  .metricName{
    font-size:11px;
  }

  .score{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>
      <div class="brand">LifeOS</div>
      <div class="subtitle">One day. Eight dimensions. One picture.</div>
    </div>

    <button class="home" onclick="goToday()">⌂</button>
  </div>

  <div class="datebar">
    <button onclick="changeDay(-1)">‹</button>
    <div class="date" id="date"></div>
    <button onclick="changeDay(1)">›</button>
  </div>

  <div class="orbit">

    <div class="core">
      <div class="score" id="score">—</div>
      <div class="scoreLabel">DAY SCORE</div>
    </div>

    <div class="metric" data-index="0">
      <div class="metricCircle" id="m0">—</div>
      <div class="metricName">Sleep</div>
    </div>

    <div class="metric" data-index="1">
      <div class="metricCircle" id="m1">—</div>
      <div class="metricName">Energy</div>
    </div>

    <div class="metric" data-index="2">
      <div class="metricCircle" id="m2">—</div>
      <div class="metricName">Mood</div>
    </div>

    <div class="metric" data-index="3">
      <div class="metricCircle" id="m3">—</div>
      <div class="metricName">Focus</div>
    </div>

    <div class="metric" data-index="4">
      <div class="metricCircle" id="m4">—</div>
      <div class="metricName">Sport</div>
    </div>

    <div class="metric" data-index="5">
      <div class="metricCircle" id="m5">—</div>
      <div class="metricName">Food</div>
    </div>

    <div class="metric" data-index="6">
      <div class="metricCircle" id="m6">—</div>
      <div class="metricName">Social</div>
    </div>

    <div class="metric" data-index="7">
      <div class="metricCircle" id="m7">—</div>
      <div class="metricName">Calm</div>
    </div>

  </div>

  <div class="card">

    <h2 id="dayTitle">Today</h2>

    <div class="hint">
      Tap a metric, then choose 1–10. One tap is enough.
    </div>

    <textarea
      id="note"
      placeholder="Quick note about the day..."
    ></textarea>

    <button class="save" onclick="saveDay()">
      Save this day
    </button>

  </div>

  <div class="card history">

    <div class="historyTitle">History</div>

    <div id="history"></div>

  </div>

</div>

<!-- NUMBER PICKER -->

<div class="picker" id="picker">

  <div class="pickerTitle" id="pickerTitle">
    Choose a number
  </div>

  <div class="numbers">
    <button class="number" onclick="choose(1)">1</button>
    <button class="number" onclick="choose(2)">2</button>
    <button class="number" onclick="choose(3)">3</button>
    <button class="number" onclick="choose(4)">4</button>
    <button class="number" onclick="choose(5)">5</button>
    <button class="number" onclick="choose(6)">6</button>
    <button class="number" onclick="choose(7)">7</button>
    <button class="number" onclick="choose(8)">8</button>
    <button class="number" onclick="choose(9)">9</button>
    <button class="number" onclick="choose(10)">10</button>
  </div>

</div>

<script>

/* =========================
   LIFEOS DATA
========================= */

const names = [
  "Sleep",
  "Energy",
  "Mood",
  "Focus",
  "Sport",
  "Food",
  "Social",
  "Calm"
];

const KEY = "lifeos_days_v3";

let data = JSON.parse(
  localStorage.getItem(KEY) || "{}"
);

let viewDate = new Date();
let activeMetric = null;


/* =========================
   DATE
========================= */

function dateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}

function prettyDate(d){

  return d.toLocaleDateString(
    undefined,
    {
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );
}

function isToday(d){

  return dateKey(d) === dateKey(new Date());

}


/* =========================
   GET DAY
========================= */

function getDay(d){

  const key = dateKey(d);

  if(!data[key]){
    data[key] = {
      scores:Array(8).fill(null),
      note:""
    };
  }

  return data[key];
}


/* =========================
   RENDER
========================= */

function render(){

  const d = getDay(viewDate);

  document.getElementById("date").textContent =
    prettyDate(viewDate);

  document.getElementById("dayTitle").textContent =
    isToday(viewDate) ? "Today" : prettyDate(viewDate);

  for(let i=0;i<8;i++){

    document.getElementById("m"+i).textContent =
      d.scores[i] ?? "—";
  }

  const valid =
    d.scores.filter(v => v !== null);

  let score = "—";

  if(valid.length){
    const average =
      valid.reduce((a,b)=>a+b,0) / valid.length;

    score = Math.round(average * 10) + "%";
  }

  document.getElementById("score").textContent =
    score;

  document.getElementById("note").value =
    d.note || "";

  renderHistory();
}


/* =========================
   METRIC CLICK
========================= */

document.querySelectorAll(".metric")
.forEach(metric => {

  metric.addEventListener("click", () => {

    activeMetric =
      Number(metric.dataset.index);

    document.getElementById("pickerTitle")
      .textContent =
      "Rate " + names[activeMetric];

    document.getElementById("picker")
      .classList.add("show");

  });

});


/* =========================
   CHOOSE 1–10
========================= */

function choose(value){

  if(activeMetric === null) return;

  const d = getDay(viewDate);

  d.scores[activeMetric] = value;

  data[dateKey(viewDate)] = d;

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

  document.getElementById("picker")
    .classList.remove("show");

  activeMetric = null;

  render();
}


/* =========================
   SAVE DAY
========================= */

function saveDay(){

  const d = getDay(viewDate);

  d.note =
    document.getElementById("note").value;

  data[dateKey(viewDate)] = d;

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

  render();

  alert("Day saved ✓");
}


/* =========================
   CHANGE DAY
========================= */

function changeDay(amount){

  viewDate.setDate(
    viewDate.getDate() + amount
  );

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================
   TODAY
========================= */

function goToday(){

  viewDate = new Date();

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================
   HISTORY
========================= */

function renderHistory(){

  const box =
    document.getElementById("history");

  const keys =
    Object.keys(data)
      .sort()
      .reverse();

  if(!keys.length){

    box.innerHTML =
      "<div style='opacity:.6'>No saved days yet.</div>";

    return;
  }

  box.innerHTML = "";

  keys.slice(0,30).forEach(key => {

    const d = data[key];

    const valid =
      d.scores.filter(v => v !== null);

    let score = "—";

    if(valid.length){

      const avg =
        valid.reduce((a,b)=>a+b,0) / valid.length;

      score =
        Math.round(avg * 10) + "%";
    }

    const item =
      document.createElement("div");

    item.className =
      "historyItem";

    item.innerHTML = `
      <div class="historyDate">
        ${formatHistoryDate(key)}
      </div>

      <div class="historyScore">
        ${score}
      </div>
    `;

    item.onclick = () => {

      const parts = key.split("-");

      viewDate =
        new Date(
          Number(parts[0]),
          Number(parts[1])-1,
          Number(parts[2])
        );

      render();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    };

    box.appendChild(item);

  });

}


function formatHistoryDate(key){

  const parts =
    key.split("-");

  const d =
    new Date(
      Number(parts[0]),
      Number(parts[1])-1,
      Number(parts[2])
    );

  return d.toLocaleDateString(
    undefined,
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}


/* =========================
   CLOSE PICKER
========================= */

document.addEventListener("click", e => {

  const picker =
    document.getElementById("picker");

  if(
    picker.classList.contains("show") &&
    !picker.contains(e.target) &&
    !e.target.closest(".metric")
  ){

    picker.classList.remove("show");

    activeMetric = null;

  }

});


/* =========================
   PREVENT DOUBLE-TAP ZOOM
========================= */

let lastTouch = 0;

document.addEventListener(
  "touchend",
  function(e){

    const now = Date.now();

    if(now - lastTouch <= 300){

      e.preventDefault();

    }

    lastTouch = now;

  },
  {passive:false}
);


/* =========================
   START
========================= */

render();

</script>

</body>
</html>
