<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               minimum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>LifeOS</title>

<style>
:root{
  --bg:#090612;
  --bg2:#120b22;
  --panel:#110c20;
  --panel2:#171027;
  --line:rgba(255,255,255,.16);
  --line2:rgba(255,255,255,.08);
  --text:#f7efff;
  --muted:#a79bb8;
  --pink:#f19bdc;
  --pink2:#d96bc5;
  --purple:#8e65d8;
  --blue:#7c69d9;
  --green:#79d6a1;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
               "Segoe UI",sans-serif;
  overscroll-behavior:none;
  touch-action:manipulation;
}

body{
  overflow-x:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  color:inherit;
}

.app{
  min-height:100vh;
  padding:
    max(18px,env(safe-area-inset-top))
    18px
    max(90px,env(safe-area-inset-bottom))
    18px;

  background:
    radial-gradient(circle at 50% 28%,
      rgba(123,74,174,.34),
      transparent 32%),
    radial-gradient(circle at 15% 72%,
      rgba(81,45,127,.25),
      transparent 35%),
    radial-gradient(circle at 90% 55%,
      rgba(53,38,118,.24),
      transparent 35%),
    linear-gradient(145deg,#06040b 0%,#10091c 42%,#17102c 100%);
}

/* ---------- HEADER ---------- */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.navBtn{
  width:46px;
  height:46px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(10,7,18,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  color:#fff;
  cursor:pointer;
}

.navBtn:active{
  transform:scale(.94);
  background:rgba(241,155,220,.15);
}

.dateBox{
  text-align:center;
  flex:1;
  padding:0 8px;
}

.weekday{
  color:#aaa0b5;
  font-size:14px;
  letter-spacing:.08em;
  margin-bottom:3px;
}

.date{
  font-size:20px;
  font-weight:700;
}

.scoreLabel{
  margin-top:18px;
  text-align:center;
  font-size:13px;
  letter-spacing:.25em;
  color:#d2c5da;
}

.score{
  text-align:center;
  font-size:76px;
  line-height:.95;
  font-weight:800;
  color:var(--pink);
  text-shadow:0 0 30px rgba(241,155,220,.22);
  margin-top:8px;
}

.dayMood{
  text-align:center;
  font-size:22px;
  margin-top:10px;
  color:#e8d9ed;
}

/* ---------- RADAR ---------- */

.radarArea{
  position:relative;
  width:100%;
  max-width:700px;
  margin:8px auto 0;
  height:590px;
}

.radar{
  position:absolute;
  left:50%;
  top:45px;
  width:min(86vw,570px);
  height:min(86vw,570px);
  transform:translateX(-50%);
}

.radar svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.grid{
  fill:none;
  stroke:rgba(255,255,255,.15);
  stroke-width:1;
}

.axis{
  stroke:rgba(255,255,255,.16);
  stroke-width:1;
}

.dataArea{
  fill:rgba(238,133,218,.10);
  stroke:var(--pink);
  stroke-width:2;
  filter:drop-shadow(0 0 8px rgba(241,155,220,.35));
}

.dataPoint{
  fill:var(--pink);
  filter:drop-shadow(0 0 7px rgba(241,155,220,.8));
}

.centerPoint{
  fill:#f4b5e9;
  stroke:#fff;
  stroke-width:1;
}

/* ---------- METRICS ---------- */

.metric{
  position:absolute;
  width:108px;
  text-align:center;
  z-index:5;
}

.metricTop{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin-bottom:2px;
}

.metricIcon{
  font-size:18px;
}

.metricName{
  font-size:15px;
  color:#eee5f1;
}

.metricValue{
  font-size:31px;
  line-height:1;
  font-weight:500;
  margin:3px 0 3px;
}

.metricSub{
  color:#94879e;
  font-size:12px;
}

.metricControls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:5px;
}

.smallBtn{
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(8,5,15,.68);
  color:#fff;
  font-size:22px;
  line-height:1;
  cursor:pointer;
}

.smallBtn:active{
  transform:scale(.9);
  background:rgba(241,155,220,.18);
}

.metric.clickable .metricValue,
.metric.clickable .metricName{
  cursor:pointer;
}

/* Positions */

.mSleep{
  top:0;
  left:50%;
  transform:translateX(-50%);
}

.mEnergy{
  top:103px;
  right:-2px;
}

.mMood{
  top:255px;
  right:-7px;
}

.mFocus{
  bottom:25px;
  right:47px;
}

.mProductivity{
  bottom:-10px;
  left:50%;
  transform:translateX(-50%);
}

.mGoals{
  bottom:25px;
  left:47px;
}

.mHealth{
  top:255px;
  left:-7px;
}

.mSocial{
  top:103px;
  left:-2px;
}

/* ---------- SCORE INFO ---------- */

.scoreInfo{
  text-align:center;
  color:#988ba4;
  font-size:12px;
  margin-top:-12px;
}

/* ---------- RECENT DAYS ---------- */

.panel{
  max-width:700px;
  margin:20px auto 0;
  background:rgba(12,8,23,.78);
  border:1px solid rgba(255,255,255,.15);
  border-radius:24px;
  padding:20px;
  backdrop-filter:blur(16px);
  box-shadow:0 20px 60px rgba(0,0,0,.22);
}

.panelTitle{
  font-size:19px;
  font-weight:700;
  letter-spacing:.05em;
  margin-bottom:15px;
}

.days{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:3px;
  scrollbar-width:none;
}

.days::-webkit-scrollbar{
  display:none;
}
